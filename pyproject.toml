[project]
name = "spartan-torch"
version = "0.1.0"
description = "Custom layers and building blocks for PyTorch — assemble and fine-tune models fast"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mievst" }]
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
spartan-torch = "spartan_torch:main"

[project.optional-dependencies]
dev = [
    "albumentationsx>=2.3.7",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "pytest>=8.3.0",
    "tqdm>=4.70.0",
]
experiments = [
    "datasets>=3.0",
    "ipywidgets>=8",
    "lightning>=2.5",
    "litlogger>=2026.6.25",
    "mlflow>=2.20",
    "timm>=1.0",
    "tokenizers>=0.20",
    "transformers[torch]>=4.50",
    "trl>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"
