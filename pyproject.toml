[project]
name = "spartan-torch"
version = "0.1.0"
description = "Efficient Deep Learning blocks and paper replications for low-VRAM training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "bitsandbytes>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "ty>=0.0.59",
    "pytest>=8.0.0",
    "bandit>=1.7.0",
]
bench = [
    "triton>=3.0.0",
    "flash-attn>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
spartan-torch = { path = ".", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N812",  # lowercase `F` imported as non-lowercase (torch.nn.functional convention)
    "N801",  # class name CapWords (public API uses lowercase)
    "B028",  # stacklevel in warnings.warn
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "experiments"]
skips = ["B101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spartan_torch"]
