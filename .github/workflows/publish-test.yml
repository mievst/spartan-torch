name: publish-test

# Staging release to TestPyPI. Manual dispatch only (Actions → publish-test
# → Run workflow), optionally from any branch for pre-release checks.
# Auth is Trusted Publishing (OIDC) — no tokens. TestPyPI needs a pending
# publisher for this repo + this workflow file (one-time setup in TestPyPI
# project Settings → Publishing).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish --publish-url https://test.pypi.org/legacy/
